{% extends "base.html" %}
{% block content %}
<h2>Manipulation Result</h2>

<div class="compare-container">
  <div class="compare-tabs">
    <button id="tab1" class="tab active">Original</button>
    <button id="tab2" class="tab">Modified</button>
  </div>

  <div class="compare-views">
    <img id="img1" src="{{ image.original.url }}" class="compare-img active">
    <img id="img2" src="{{ image.modified.url }}" class="compare-img">
  </div>
</div>

<div class="buttons">
  <a href="/" class="btn">Back to Gallery</a>
  <a href="{{ image.modified.url }}" download class="btn download">Download Image</a>
</div>

<style>
.compare-container {
  text-align: center;
  margin: 20px auto;
  width: 80%;
}
.compare-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}
.tab {
  background: #f0f0f0;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.3s ease;
}
.tab.active {
  background: #007bff;
  color: white;
}
.compare-img {
  max-width: 90%;
  display: none;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.compare-img.active {
  display: inline-block;
}
.buttons {
  text-align: center;
  margin-top: 20px;
}
.btn {
  background: #007bff;
  color: white;
  padding: 10px 15px;
  text-decoration: none;
  border-radius: 10px;
  margin: 5px;
  transition: 0.3s;
}
.btn:hover {
  background: #0056b3;
}
.btn.download {
  background: #28a745;
}
.btn.download:hover {
  background: #1e7e34;
}
</style>

<script>
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.compare-img').forEach(i => i.classList.remove('active'));
    tab.classList.add('active');
    if (tab.id === 'tab1') document.getElementById('img1').classList.add('active');
    else document.getElementById('img2').classList.add('active');
  });
});
</script>
{% endblock %}
