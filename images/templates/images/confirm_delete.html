{% extends "base.html" %}
{% block content %}
<div class="container mt-5 text-center">
  <h3 class="text-danger">Confirm Deletion</h3>
  <p>Are you sure you want to delete <strong>{{ image.title }}</strong> and all its processed versions?</p>

  <img src="{{ image.image.url }}" class="img-fluid rounded-3 shadow mb-3" style="max-width: 300px;">

  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
    <a href="{% url 'images:gallery' %}" class="btn btn-secondary btn-lg ms-2">Cancel</a>
  </form>
</div>
{% endblock %}
