<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Image Studio{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background: #f7f8fc;
      color: #222;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #0052D4, #4364F7, #6FB1FC);
      color: white;
      padding: 15px 30px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    main {
      padding: 30px;
      min-height: 80vh;
    }
    footer {
      background: #222;
      color: #ccc;
      text-align: center;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 Django Image Studio</h1>
  </header>

  <main class="container">
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    &copy; 2025 Image Studio — Powered by Django
  </footer>
</body>
</html>
