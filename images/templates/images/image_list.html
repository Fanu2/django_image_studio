<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery</title>
    <style>
        :root {
            --primary-color: #3366cc;
            --primary-dark: #254b8a;
            --bg-light: #f5f8fd;
            --card-bg: #ffffff;
            --text-dark: #2c3e50;
            --text-light: #555;
            --border: #d0d7e2;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, var(--bg-light), #e4ebf5);
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: var(--text-dark);
            margin-bottom: 25px;
            font-size: 32px;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }

        .upload-link {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(51, 102, 204, 0.25);
            margin-bottom: 30px;
        }

        .upload-link:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 75, 138, 0.3);
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .gallery-item {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 220px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border);
        }

        .gallery-item h3 {
            font-size: 15px;
            color: var(--text-dark);
            margin: 10px 0 6px;
        }

        .gallery-item a.manipulate-link {
            display: inline-block;
            color: var(--primary-color);
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
        }

        .gallery-item a.manipulate-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .delete-btn {
            display: inline-block;
            margin: 10px 0 15px;
            padding: 6px 14px;
            background: #e74c3c;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .empty-message {
            color: var(--text-light);
            font-size: 16px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <h1>My Image Gallery</h1>
    <p>
        <a class="upload-link" href="{% url 'images:upload_image' %}">➕ Upload New Image</a>
    </p>

    <div class="gallery">
        {% for image in images %}
            <div class="gallery-item">
                <a class="manipulate-link" href="{% url 'images:manipulate_image' image.pk %}">
                    <img src="{{ image.image.url }}" alt="{{ image.title }}">
                </a>
                <h3>{{ image.title|default:"Untitled" }}</h3>
                <a class="delete-btn" href="{% url 'images:delete_image' image.pk %}">🗑 Delete</a>
            </div>
        {% empty %}
            <p class="empty-message">
                No images uploaded yet.<br>Click <strong>“Upload New Image”</strong> to get started!
            </p>
        {% endfor %}
    </div>
</body>
</html>
