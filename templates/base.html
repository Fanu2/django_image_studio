<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Django Image Studio{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6fb;
      font-family: 'Segoe UI', sans-serif;
      color: #222;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #0052D4, #4364F7, #6FB1FC);
      color: white;
      text-align: center;
      padding: 20px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    }
    footer {
      background: #1e1e1e;
      color: #aaa;
      text-align: center;
      padding: 10px;
      font-size: 0.9rem;
    }
    .container {
      padding: 30px 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 Django Image Studio</h1>
  </header>

  <div class="container">
    {% block content %}
    {% endblock %}
  </div>

  <footer>
    &copy; 2025 Image Studio | Powered by Django
  </footer>
</body>
</html>
